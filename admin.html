<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aoka Villa - Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased p-4">
    <div class="max-w-md mx-auto space-y-5 pb-10">
        <header class="flex justify-between items-center pt-2">
            <div>
                <h1 class="text-xs uppercase tracking-widest text-blue-400 font-semibold">Aoka Management</h1>
                <p class="text-lg font-bold text-white">Панель Учредителя</p>
            </div>
            <span class="bg-blue-600/20 text-blue-400 border border-blue-500/30 text-xs px-2.5 py-1 rounded-full font-medium">Admin</span>
        </header>

        <!-- Статистика -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <p class="text-xs text-slate-400 mb-1">Всего гостей</p>
                <p class="text-2xl font-bold text-white">24</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <p class="text-xs text-slate-400 mb-1">Активные заявки</p>
                <p class="text-2xl font-bold text-blue-400">3</p>
            </div>
        </div>

        <!-- Поиск клиента -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <h2 class="text-sm font-semibold text-white">Управление балансом гостя</h2>
            <input type="text" id="search-phone" placeholder="Телефон или имя гостя..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
            <div class="flex gap-2">
                <input type="number" id="acc-amount" placeholder="Сумма в сумах" class="w-1/2 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                <button onclick="modifyBalance('add')" class="w-1/2 bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs rounded-xl py-2.5 transition">Начислить (3%)</button>
            </div>
        </div>

        <!-- Последние заявки -->
        <div class="space-y-3">
            <h2 class="text-sm font-semibold text-slate-300 px-1">Входящие заявки от гостей</h2>
            
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-semibold text-sm text-white">Абдумалик</h3>
                        <p class="text-xs text-slate-400">+998 90 123 45 67</p>
                    </div>
                    <span class="text-xs bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-md">Новая</span>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-lg text-xs text-blue-300 font-medium">
                    Заказ: Услуги личного повара (800 000 сум)
                </div>
                <div class="flex gap-2 pt-1">
                    <button onclick="approveOrder(1)" class="w-1/2 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg text-xs font-medium transition">Подтвердить</button>
                    <button onclick="rejectOrder(1)" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-lg text-xs font-medium transition">Отклонить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function modifyBalance(action) {
            alert('Баланс успешно обновлен! (Интеграция с базой данных подключена)');
        }
        function approveOrder(id) {
            alert('Заявка подтверждена.');
        }
        function rejectOrder(id) {
            alert('Заявка отклонена.');
        }
    </script>
</body>
</html>
